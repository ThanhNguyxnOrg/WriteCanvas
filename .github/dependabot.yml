# Dependency updates for the npm manifest and the workflow actions.
#
# Dependabot's only job is to open the pull requests. It deliberately writes
# nothing else - no labels are requested here - because every write on a pull
# request (labels, review requests, the merge itself) is performed by
# ThanhNguyxnAgent. That keeps a single identity doing the acting, and it is why
# no `labels:` key appears below: asking Dependabot to label its own pull requests
# annotated them with a bot identity and failed whenever a label was missing.
#
# Pull requests opened here run the normal CI. A low-risk patch or minor update
# can enter ThanhNguyxnAgent's guarded auto-merge path, controlled by the central
# ci-policy.json. A major or security-sensitive bump is routed to a human owner,
# because a major release can break the ink/file APIs the app relies on. A
# workflow change is always read by a person, even when it is only an action bump.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Electron and electron-builder majors are a platform decision, not a
      # drive-by bump: the app targets Windows, macOS and Linux from one code
      # path and pins the Electron major deliberately.
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
      - dependency-name: electron-builder
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # The managed Agent signal workflow pins this action by commit digest, and
      # the organization onboarder owns that pin, so Dependabot rewriting every
      # reference to a full version tag breaks the pin convention enforced by
      # tests/workflows.test.mjs. A major bump here is a review decision.
      - dependency-name: actions/upload-artifact
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
