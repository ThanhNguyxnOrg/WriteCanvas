name: CodeQL

# Static analysis for the renderer, the Electron main process and the preload
# bridge. The preload script is the only place renderer code can reach Node, so
# findings there matter most.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - name: Analyze
        uses: github/codeql-action/analyze@v4