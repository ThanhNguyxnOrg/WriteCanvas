name: CI

# Unit tests are plain node:test files and do not boot Electron. Keep the OS
# matrix that catches platform-specific regressions, but delegate setup and
# execution to the organization-wide Node workflow.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22.x"]
        include:
          - os: ubuntu-latest
            node: "24.x"
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-node.yml@487331d8d32ef5847ac1e53935681669cf56e331
    with:
      job_name: ${{ matrix.os }} / node ${{ matrix.node }}
      runner: ${{ matrix.os }}
      node_version: ${{ matrix.node }}
      package_manager: npm
      cache: npm
      cache_dependency_path: package-lock.json
      install_command: npm ci --ignore-scripts
      test_command: npm test
      timeout_minutes: 25

  syntax:
    uses: ThanhNguyxnOrg/.github/.github/workflows/ci-node.yml@487331d8d32ef5847ac1e53935681669cf56e331
    with:
      job_name: syntax check
      node_version: "22"
      package_manager: npm
      install_dependencies: false
      lint_command: |
        status=0
        for file in main/*.js preload.js src/js/*.js .github/scripts/*.mjs; do
          if node --check "$file"; then
            echo "ok   $file"
          else
            echo "FAIL $file"
            status=1
          fi
        done
        exit "$status"
      timeout_minutes: 10
