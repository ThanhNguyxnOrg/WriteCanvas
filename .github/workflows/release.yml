name: Release

# Build installers when the central release controller creates a vX.Y.Z tag.
# Version files, changelog, tag and GitHub Release metadata are owned centrally.
#
# Building happens only here, never on an ordinary push: three operating systems
# each download Electron and package the app, which is far too much work to do
# for a commit that is not a release.
#
# This workflow only builds and uploads platform assets to the central draft release.
on:
  create:

permissions:
  actions: read
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: resolve centrally created tag
    if: github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - name: Resolve central release tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid centrally created release tag: $TAG"
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  build:
    name: build / ${{ matrix.os }} / ${{ matrix.arch }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.skip == 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One job per architecture, on a runner of that architecture, so the
        # launch check below runs the real binary rather than an emulation.
        # Linux arm64 ships the AppImage only: the deb target is built with fpm,
        # and electron-builder's bundled fpm is an x86 binary that cannot run on
        # an arm64 runner.
        include:
          - os: windows-latest
            arch: x64
            targets: --win nsis
          - os: macos-15-intel
            arch: x64
            targets: --mac dmg
          - os: macos-latest
            arch: arm64
            targets: --mac dmg
          - os: ubuntu-latest
            arch: x64
            targets: --linux AppImage deb
          - os: ubuntu-24.04-arm
            arch: arm64
            targets: --linux AppImage
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Unlike the test job this one needs the real Electron binary, because the
      # packaged app has to contain it.
      - name: Install dependencies
        run: npm ci

      # The deb target shells out to fakeroot, and the smoke launch below needs a
      # display for Electron. Installing both keeps the job independent of what
      # the runner image happens to include.
      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot xvfb

      - name: Build the installer
        env:
          # No code signing: the builds are unsigned, so electron-builder must not
          # go looking for a certificate.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist -- --publish never --${{ matrix.arch }} ${{ matrix.targets }}

      # Reads the app.asar that is about to be packaged and refuses to continue
      # if the bridge or the renderer is missing. This is the check that would
      # have caught the 0.1.0 installer opening to "No host bridge found".
      - name: Verify the packaged bundle
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: node .github/scripts/verify-package.mjs

      # Starts the packaged app on this runner and asks the page whether the
      # bridge and the editor came up. A bundle can be complete and still fail to
      # launch on one platform, which is exactly what this catches.
      - name: Launch the packaged app
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: node .github/scripts/smoke-package.mjs

      - name: Collect the installer
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish installers through the organization library
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.skip == 'false'
    permissions:
      actions: read
      contents: read
    uses: ThanhNguyxnOrg/.github/.github/workflows/release-publish.yml@5d251b08e6d0360e2eee2da4f792bd179d87ccc9
    with:
      tag: v${{ needs.prepare.outputs.version }}
      artifact_pattern: release-assets-*
      artifact_directory: dist/release
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_PRIVATE_KEY: ${{ secrets.BOT_PRIVATE_KEY }}
