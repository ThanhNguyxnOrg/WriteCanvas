<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WriteCanvas</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data: file:; style-src 'self' 'unsafe-inline'" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="side-head">
        <span class="logo">WriteCanvas</span>
        <div class="side-actions">
          <button id="btnNewFolder" title="New folder (Ctrl+Shift+N)">+ Folder</button>
          <button id="btnNewNote" title="New note (Ctrl+N)">+ Note</button>
        </div>
      </div>
      <div id="tree"></div>
      <div class="side-foot">
        <button id="btnImport" title="Import PNG notes">Import…</button>
        <button id="btnReveal" title="Open library folder">Folder</button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div class="group" id="toolGroup">
          <button class="tool active" data-tool="pen" title="Pen (P)">✎</button>
          <button class="tool" data-tool="erase" title="Eraser (E)">⌫</button>
          <button class="tool" data-tool="pan" title="Pan (Space / P)">✋</button>
        </div>
        <div class="sep"></div>
        <div class="group" id="tune">
          <label>W <input id="width" type="range" min="0.5" max="12" step="0.5" value="2.5"><span id="widthVal">2.5mm</span></label>
          <label>α <input id="opacity" type="range" min="10" max="100" step="5" value="100"><span id="opacityVal">100%</span></label>
        </div>
        <div class="sep"></div>
        <div class="group">
          <div id="palette"></div>
          <input id="colorPicker" type="color" value="#000000" title="Custom color">
        </div>
        <div class="sep"></div>
        <div class="group">
          <button id="btnUndo" title="Undo (Ctrl+Z)" disabled>↩</button>
          <button id="btnRedo" title="Redo (Ctrl+Y)" disabled>↪</button>
        </div>
        <div class="sep"></div>
        <div class="group">
          <button id="btnPaper" title="Paper settings">▦</button>
          <button id="btnPlay" title="Play ink replay">▶</button>
          <button id="btnExport" title="Export (Ctrl+E)">⤓</button>
        </div>
        <div class="flex"></div>
        <div id="noteTitle" class="title">No note</div>
        <div id="saveState" class="state"></div>
      </header>

      <section id="viewport">
        <div id="canvasHost">
          <div id="canvasStack">
            <div id="stackInner">
              <canvas id="paperC"></canvas>
              <canvas id="rasterC"></canvas>
              <canvas id="inkC"></canvas>
              <canvas id="liveC"></canvas>
            </div>
          </div>
        </div>
        <div id="pagesBar"></div>
        <button id="btnAddPage" title="Add page">+</button>
      </section>
    </main>
  </div>

  <div id="paperFlyout" class="flyout hidden">
    <div class="flyout-row"><label>Size</label>
      <select id="paperSize">
        <option value="letter">Letter</option><option value="a4">A4</option>
        <option value="a5">A5</option><option value="square">Square</option>
      </select></div>
    <div class="flyout-row"><label>Orient.</label>
      <select id="paperOrient"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></div>
    <div class="flyout-row"><label>Template</label>
      <select id="paperTpl">
        <option value="ruled">Ruled</option><option value="grid">Grid</option>
        <option value="dotted">Dotted</option><option value="graph">Graph</option>
        <option value="black">Black</option><option value="blank">Blank</option>
      </select></div>
    <div class="flyout-row"><label>Background</label><input id="paperBg" type="color" value="#ffffff"></div>
  </div>

  <div id="ctxMenu" class="ctxmenu hidden"></div>
  <div id="dlg" class="hidden"><div id="dlgBox"><div id="dlgText"></div><input id="dlgInput" /><div><button id="dlgOk">OK</button><button id="dlgCancel">Cancel</button></div></div></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
