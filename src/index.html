<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WriteCanvas</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data: file:; style-src 'self' 'unsafe-inline'" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="img/writecanvas.png" />
</head>
<body>
  <!-- inline SVG icon set (flat, Segoe MDL2-shaped); licensed-free redraw -->
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
    <symbol id="ic-menu" viewBox="0 0 24 24"><path d="M3 6.5h18M3 12h18M3 17.5h18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="ic-save" viewBox="0 0 24 24"><path d="M4.5 4.5h12.1L19.5 7.4v12.1H4.5z M7.5 4.5v5h8v-5 M7.5 12h9v7.5h-9z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></symbol>
    <symbol id="ic-undo" viewBox="0 0 24 24"><path d="M8.5 6.5 4 11l4.5 4.5 M4 11h10a6 6 0 0 1 6 6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-redo" viewBox="0 0 24 24"><path d="M15.5 6.5 20 11l-4.5 4.5 M20 11H10a6 6 0 0 0-6 6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-page" viewBox="0 0 24 24"><path d="M6 3.5h9l4 4V20.5H6z M14.5 3.5V8h4.5" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></symbol>
    <symbol id="ic-tune" viewBox="0 0 24 24"><path d="M7 4v6m0 4v6m10-16v10m0 4v2 M4.5 10h5 M14.5 14h5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="ic-export" viewBox="0 0 24 24"><path d="M12 3.5v11m0 0 4-4m-4 4-4-4 M4.5 17.5v3h15v-3" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-play" viewBox="0 0 24 24"><path d="M8 5.5 18 12 8 18.5z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></symbol>
    <symbol id="ic-area" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5" stroke="currentColor" stroke-width="1.7" fill="none"/></symbol>
    <symbol id="ic-paste" viewBox="0 0 24 24"><path d="M9 4.5h6v2.8H9z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><path d="M6.6 5.4V6.8H4.9V21h14.2V6.8h-1.7" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></symbol>
    <symbol id="ic-paper" viewBox="0 0 24 24"><path d="M6.5 4v16M17.5 4v16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="6.5" cy="10" r="2.6" stroke="currentColor" stroke-width="1.7" fill="none"/><circle cx="17.5" cy="14.5" r="2.6" stroke="currentColor" stroke-width="1.7" fill="none"/></symbol>
    <symbol id="ic-laser" viewBox="0 0 24 24"><path d="M15.5 5c-5.5-2-9.5.3-8.5 3.2 1 3 8 2 9.5 5.2 1.4 3-1.5 5.6-7.5 4.6-1.8-.3-3.3-1-4-1.8" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="ic-ruler" viewBox="0 0 24 24"><path d="M3 16.8 16.8 3l4.2 4.2L7.2 21z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/><path d="m8.5 15.6 2-2m-4.6-1 2-2m6.2-1.4 2-2m-4.7-1 2-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="ic-object" viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="1.5" stroke="currentColor" stroke-width="1.8" fill="none"/></symbol>
    <symbol id="ic-eraser" viewBox="0 0 24 24"><path d="M5.2 14.7 12.4 7.5a2 2 0 0 1 2.8 0l3.3 3.3a2 2 0 0 1 0 2.8l-5.6 5.6H9.3l-4.1-4.1a1.6 1.6 0 0 1 0-2.4z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/><path d="M12.5 8.4l3.6 3.6M13.5 19.2h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="ic-lasso" viewBox="0 0 24 24"><rect x="4.5" y="6" width="15" height="12" rx="2.2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-dasharray="3.4 2.8"/></symbol>
    <symbol id="ic-eye" viewBox="0 0 24 24"><path d="M2.8 12S6.6 5.8 12 5.8 21.2 12 21.2 12 17.4 18.2 12 18.2 2.8 12 2.8 12z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.7" fill="none"/></symbol>
    <symbol id="pt-marker" viewBox="0 0 24 24"><path d="M12 3.5c1.1 0 2 .9 2 2v6.2l2 4.3-1.4.8 1 3.2a8.6 8.6 0 0 1-7.2 0l1-3.2-1.4-.8 2-4.3V5.5c0-1.1.9-2 2-2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="19.4" r="0.4" fill="currentColor"/></symbol>
    <symbol id="pt-pencil" viewBox="0 0 24 24"><path d="M12 3.5c1.1 0 2 .9 2 2v6.2l2 4.3-1.4.8 1 3.2a8.6 8.6 0 0 1-7.2 0l1-3.2-1.4-.8 2-4.3V5.5c0-1.1.9-2 2-2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 12h4" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="pt-calligraphy" viewBox="0 0 24 24"><path d="M12 3.5c1.1 0 2 .9 2 2v6.2l2 4.3-1.4.8 1 3.2a8.6 8.6 0 0 1-7.2 0l1-3.2-1.4-.8 2-4.3V5.5c0-1.1.9-2 2-2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 10v9.5" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="pt-highlighter" viewBox="0 0 24 24"><path d="M9.5 3.5h5c.8 0 1.4.6 1.4 1.4v6.3l2.6 5-1.5.9 1.2 4a17 17 0 0 1-11.4 0l1.2-4-1.5-.9 2.6-5V4.9c0-.8.6-1.4 1.4-1.4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="pt-highlighterSquared" viewBox="0 0 24 24"><path d="M10.2 3.5h3.6c.7 0 1.3.6 1.3 1.3v6l2.2 4.6-1.3.8 1 3.9a14.4 14.4 0 0 1-9 0l1-3.9-1.3-.8 2.2-4.6v-6c0-.7.6-1.3 1.3-1.3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  </svg>

  <div id="app">
    <div id="capRow"><span id="capTitle">WriteCanvas</span></div>
    <aside id="sidebar">
      <div id="pagesBar"></div>
      <button id="btnAddPage" title="Add page">+</button>
    </aside>

    <main id="main">
      <header id="topbar">
        <div class="tb-group" id="tbLeft">
          <button id="btnMenu" class="tb-btn" title="Menu" aria-label="Menu"><svg><use href="#ic-menu"/></svg></button>
          <button id="btnSave" class="tb-btn" title="Save (Ctrl+S)" aria-label="Save"><svg><use href="#ic-save"/></svg></button>
          <button id="btnUndo" class="tb-btn" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg><use href="#ic-undo"/></svg></button>
          <button id="btnRedo" class="tb-btn" title="Redo (Ctrl+Y)" aria-label="Redo" disabled><svg><use href="#ic-redo"/></svg></button>
          <button id="btnPaste" class="tb-btn" title="Paste (Ctrl+V)" aria-label="Paste" disabled><svg><use href="#ic-paste"/></svg></button>
          <button id="btnNew" class="tb-btn" title="New note" aria-label="New note"><svg><use href="#ic-page"/></svg></button>
          <button id="btnPaper" class="tb-btn" title="Paper" aria-label="Paper"><svg><use href="#ic-paper"/></svg></button>
        </div>
        <div id="tbTitle"><button id="btnTitle" title="Rename" aria-label="Rename note">No note</button><span id="tbPages"></span></div>
        <div class="tb-group" id="tbPens" role="listbox" aria-label="Pens"></div>
        <div class="tb-group" id="tbToggles">
          <button class="tb-toggle" id="tbLaser" title="Laser pointer" aria-label="Laser pointer" aria-pressed="false"><svg><use href="#ic-laser"/></svg></button>
          <button class="tb-toggle" id="tbRuler" title="Ruler" aria-label="Ruler" aria-pressed="false"><svg><use href="#ic-ruler"/></svg></button>
          <button class="tb-toggle" id="tbObject" title="Objects" aria-label="Objects" aria-pressed="false"><svg><use href="#ic-object"/></svg></button>
          <button class="tb-toggle" id="tbEraser" title="Eraser" aria-label="Eraser" aria-pressed="false"><svg><use href="#ic-eraser"/></svg></button>
          <button class="tb-toggle" id="tbLasso" title="Select" aria-label="Select" aria-pressed="false"><svg><use href="#ic-lasso"/></svg></button>
          <button class="tb-toggle no-arrow" id="tbEye" title="Eye" aria-label="Eye" aria-pressed="false"><svg><use href="#ic-eye"/></svg></button>
        </div>
        <div id="saveState" role="status"></div>
      </header>

      <section id="viewport">
        <div id="canvasHost">
          <div id="canvasStack">
            <div id="stackInner">
              <canvas id="paperC"></canvas>
              <canvas id="rasterC"></canvas>
              <canvas id="inkC"></canvas>
              <canvas id="liveC"></canvas>
              <div id="titleStrip"><span>TITLE</span></div>
            </div>
          </div>
        </div>

        <div id="penFlyout" class="flyout hidden">
          <div class="segTools">
            <button class="tool active" data-tool="pen">Pen</button>
            <button class="tool" data-tool="erase">Eraser</button>
            <button class="tool" data-tool="pan">Pan</button>
          </div>
          <div id="penTypeRow" role="group" aria-label="Pen type"></div>
          <div class="flyout-label">Color</div>
          <div id="penPalette"></div>
          <div class="flyout-label">Size</div>
          <canvas id="wavePreview" width="480" height="64"></canvas>
          <input id="width" type="range" min="0.5" max="12" step="0.1" value="1.06" aria-label="Pen width">
          <input id="colorPicker" type="color" value="#000000" title="Custom color" hidden>
        </div>

        <div id="paperFlyout" class="flyout hidden">
          <div class="flyout-row"><label>Size</label>
            <select id="paperSize">
              <option value="letter">Letter</option><option value="legal">Legal</option>
              <option value="tabloid">Tabloid</option><option value="a0">A0</option>
              <option value="a1">A1</option><option value="a2">A2</option>
              <option value="a3">A3</option><option value="a4">A4</option>
              <option value="a5">A5</option><option value="a6">A6</option>
              <option value="a7">A7</option><option value="a8">A8</option>
            </select></div>
          <div class="flyout-row"><label>Orient.</label>
            <select id="paperOrient"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></div>
          <div class="flyout-row"><label>Template</label>
            <select id="paperTpl">
              <option value="blank">Blank</option>
              <option value="ruled">Ruled</option><option value="ruled10">Ruled 10</option>
              <option value="ruled15">Ruled 15</option><option value="ruled20">Ruled 20</option>
              <option value="ruled30">Ruled 30</option><option value="ruled40">Ruled 40</option>
              <option value="dotted10">Dots 10</option><option value="dotted20">Dots 20</option>
              <option value="graph">Graph</option><option value="isometric">Isometric</option>
              <option value="math">Math</option><option value="math10">Math 10</option>
              <option value="math15">Math 15</option><option value="math20">Math 20</option>
              <option value="math30">Math 30</option><option value="math40">Math 40</option>
              <option value="music">Music</option><option value="todo">Todo</option>
              <option value="custom">Custom</option>
            </select></div>
          <div class="flyout-row"><label>Background</label><input id="paperBg" type="color" value="#ffffff"></div>
          <div class="flyout-row"><label>Border lines</label><input id="paperBrl" type="checkbox" checked></div>
        </div>

        <div id="libraryFlyout" class="hidden">
          <div id="libHead">Library</div>
          <div id="tree"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="ctxMenu" class="ctxmenu hidden"></div>
  <div id="dlg" class="hidden"><div id="dlgBox"><div id="dlgText"></div><input id="dlgInput" /><div><button id="dlgOk">OK</button><button id="dlgCancel">Cancel</button></div></div></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
