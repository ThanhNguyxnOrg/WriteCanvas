<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WriteCanvas</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data: file:; style-src 'self' 'unsafe-inline'" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="img/writecanvas.png" />
</head>
<body>
  <!-- inline SVG icon set (flat, Segoe MDL2-shaped); licensed-free redraw -->
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
    <symbol id="ic-menu" viewBox="0 0 24 24"><path d="M3 6.5h18M3 12h18M3 17.5h18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="ic-save" viewBox="0 0 24 24"><path d="M4.5 4.5h12.1L19.5 7.4v12.1H4.5z M7.5 4.5v5h8v-5 M7.5 12h9v7.5h-9z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></symbol>
    <symbol id="ic-undo" viewBox="0 0 24 24"><path d="M8.5 6.5 4 11l4.5 4.5 M4 11h10a6 6 0 0 1 6 6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-redo" viewBox="0 0 24 24"><path d="M15.5 6.5 20 11l-4.5 4.5 M20 11H10a6 6 0 0 0-6 6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-page" viewBox="0 0 24 24"><path d="M6 3.5h9l4 4V20.5H6z M14.5 3.5V8h4.5" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></symbol>
    <symbol id="ic-tune" viewBox="0 0 24 24"><path d="M7 4v6m0 4v6m10-16v10m0 4v2 M4.5 10h5 M14.5 14h5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="ic-export" viewBox="0 0 24 24"><path d="M12 3.5v11m0 0 4-4m-4 4-4-4 M4.5 17.5v3h15v-3" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-play" viewBox="0 0 24 24"><path d="M8 5.5 18 12 8 18.5z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></symbol>
    <symbol id="ic-area" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5" stroke="currentColor" stroke-width="1.7" fill="none"/></symbol>
    <symbol id="ic-paste" viewBox="0 0 24 24"><path d="M9 4.5h6v2.8H9z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><path d="M6.6 5.4V6.8H4.9V21h14.2V6.8h-1.7" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></symbol>
    <symbol id="ic-paper" viewBox="0 0 24 24"><path d="M6.5 4v16M17.5 4v16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="6.5" cy="10" r="2.6" stroke="currentColor" stroke-width="1.7" fill="none"/><circle cx="17.5" cy="14.5" r="2.6" stroke="currentColor" stroke-width="1.7" fill="none"/></symbol>
    <symbol id="ic-laser" viewBox="0 0 24 24"><path d="M15.5 5c-5.5-2-9.5.3-8.5 3.2 1 3 8 2 9.5 5.2 1.4 3-1.5 5.6-7.5 4.6-1.8-.3-3.3-1-4-1.8" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="ic-ruler" viewBox="0 0 24 24"><path d="M3 16.8 16.8 3l4.2 4.2L7.2 21z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/><path d="m8.5 15.6 2-2m-4.6-1 2-2m6.2-1.4 2-2m-4.7-1 2-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="ic-object" viewBox="0 0 24 24"><rect x="4" y="4.4" width="16" height="15.2" rx="1.6" stroke="currentColor" stroke-width="1.7" fill="none"/><circle cx="9.2" cy="9.2" r="1.7" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M6.6 16.8l4.1-4.6 2.9 2.7 2.3-2.4 2.5 4.3" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></symbol>
    <symbol id="ic-eraser" viewBox="0 0 24 24"><path d="M5.2 14.7 12.4 7.5a2 2 0 0 1 2.8 0l3.3 3.3a2 2 0 0 1 0 2.8l-5.6 5.6H9.3l-4.1-4.1a1.6 1.6 0 0 1 0-2.4z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/><path d="M12.5 8.4l3.6 3.6M13.5 19.2h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="ic-lasso" viewBox="0 0 24 24"><rect x="4.5" y="6" width="15" height="12" rx="2.2" stroke="currentColor" stroke-width="1.8" fill="none" stroke-dasharray="3.4 2.8"/></symbol>
    <symbol id="ic-eye" viewBox="0 0 24 24"><path d="M2.8 12S6.6 5.8 12 5.8 21.2 12 21.2 12 17.4 18.2 12 18.2 2.8 12 2.8 12z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.7" fill="none"/></symbol>
    <symbol id="ic-portrait" viewBox="0 0 24 24"><rect x="6.5" y="4" width="11" height="16" rx="1.2" stroke="currentColor" stroke-width="1.7" fill="none"/></symbol>
    <symbol id="ic-landscape" viewBox="0 0 24 24"><rect x="4" y="6.5" width="16" height="11" rx="1.2" stroke="currentColor" stroke-width="1.7" fill="none"/></symbol>
    <symbol id="ic-palette" viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.6 0 2.1-1 1.4-2-.9-1.7.2-3 1.8-3h2.3a3 3 0 0 0 3-3C20.5 7 16.7 3.5 12 3.5z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/><circle cx="8" cy="9" r="1.2" fill="currentColor"/><circle cx="12" cy="7.2" r="1.2" fill="currentColor"/><circle cx="15.8" cy="9" r="1.2" fill="currentColor"/></symbol>
    <symbol id="ic-pane" viewBox="0 0 24 24"><rect x="4" y="4.5" width="16" height="15" rx="1.2" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M12 4.5v15" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="ic-paneoff" viewBox="0 0 24 24"><rect x="4" y="4.5" width="16" height="15" rx="1.2" stroke="currentColor" stroke-width="1.7" fill="none"/><rect x="6.6" y="7.1" width="10.8" height="9.8" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M4.2 4.4 19.8 19.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="ic-text" viewBox="0 0 24 24"><path d="M5.5 5h13M12 5v14m-3.2 0h6.4" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-eraserpoint" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6" fill="currentColor"/><path d="M6.5 12a5.5 5.5 0 0 1 11 0" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".5"/></symbol>
    <symbol id="ic-erasersheet" viewBox="0 0 24 24"><rect x="5" y="4.5" width="14" height="15" rx="1.2" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M7.5 9l6 6m-6 0l6-6M13 7.5l4 4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".75"/></symbol>
    <symbol id="pt-marker" viewBox="0 0 24 24"><path d="M4.6 3.6C6.6 2.2 9.2 2.6 10.2 4.2 11.1 3.1 12.9 3.1 13.8 4.2 14.8 2.6 17.4 2.2 19.4 3.6 20 6.3 18.2 9.7 13 19.3L12 21.4 11 19.3C5.8 9.7 4 6.3 4.6 3.6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 7.4V18.4" stroke="currentColor" stroke-width="1.1" opacity=".75"/><circle cx="12" cy="5.6" r="1.1" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
    <symbol id="pt-pencil" viewBox="0 0 24 24"><path d="M6.9 4.8C8.4 3.2 10.4 2.9 12 2.9 13.6 2.9 15.6 3.2 17.1 4.8 16.4 8.7 14.3 13.7 12.3 20.2L11.7 20.2C9.7 13.7 7.6 8.7 6.9 4.8Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 6.8V15.4" stroke="currentColor" stroke-width="1.1" opacity=".75"/><circle cx="12" cy="4.9" r="0.95" fill="none" stroke="currentColor" stroke-width="1.1"/></symbol>
    <symbol id="pt-calligraphy" viewBox="0 0 24 24"><path d="M5.3 4.2H18.7L12.8 20.7L11.2 20.7Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 6.6V16.6" stroke="currentColor" stroke-width="1.1" opacity=".75"/></symbol>
    <symbol id="pt-highlighter" viewBox="0 0 24 24"><path d="M4.7 4.5H19.3L15.5 16.4H8.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 16.4L8 19.6H16L15 16.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 7.4V11.6" stroke="currentColor" stroke-width="1.1" opacity=".75"/></symbol>
    <symbol id="pt-highlighterSquared" viewBox="0 0 24 24"><path d="M7.3 3.6H16.7L16.3 9.6L14.9 20L9.1 20L7.7 9.6Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 9.6H16" stroke="currentColor" stroke-width="1.2" opacity=".75"/></symbol>
  </svg>

  <div id="app">
    <div id="capRow"><span id="capTitle">WriteCanvas</span></div>
    <header id="topbar">
      <div class="tb-group" id="tbLeft">
        <button id="btnMenu" class="tb-btn" title="Menu" aria-label="Menu"><svg><use href="#ic-menu"/></svg></button>
        <button id="btnSave" class="tb-btn" title="Save (Ctrl+S)" aria-label="Save"><svg><use href="#ic-save"/></svg></button>
        <button id="btnUndo" class="tb-btn" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg><use href="#ic-undo"/></svg></button>
        <button id="btnRedo" class="tb-btn" title="Redo (Ctrl+Y)" aria-label="Redo" disabled><svg><use href="#ic-redo"/></svg></button>
        <button id="btnNew" class="tb-btn" title="New note" aria-label="New note"><svg><use href="#ic-page"/></svg></button>
        <button id="btnPaper" class="tb-btn" title="Paper" aria-label="Paper"><svg><use href="#ic-paper"/></svg></button>
      </div>
      <div id="tbTitle"><button id="btnTitle" title="Rename" aria-label="Rename note">No note</button><span id="tbPages"></span></div>
      <div class="tb-group" id="tbPens" role="listbox" aria-label="Pens"></div>
      <div class="tb-group" id="tbToggles">
        <button class="tb-toggle" id="tbLaser" title="Laser pointer" aria-label="Laser pointer" aria-pressed="false"><svg><use href="#ic-laser"/></svg><span class="caret-zone" data-fly="laserFlyout"></span></button>
        <button class="tb-toggle" id="tbRuler" title="Ruler" aria-label="Ruler" aria-pressed="false"><svg><use href="#ic-ruler"/></svg><span class="caret-zone" data-fly="rulerFlyout"></span></button>
        <button class="tb-toggle" id="tbObject" title="Shapes and text" aria-label="Shapes and text" aria-pressed="false"><svg><use href="#ic-object"/></svg><span class="caret-zone" data-fly="shapeFlyout"></span></button>
        <button class="tb-toggle" id="tbEraser" title="Eraser" aria-label="Eraser" aria-pressed="false"><svg><use href="#ic-eraser"/></svg><span class="caret-zone" data-fly="eraserFlyout"></span></button>
        <button class="tb-toggle" id="tbLasso" title="Select" aria-label="Select" aria-pressed="false"><svg><use href="#ic-lasso"/></svg><span class="caret-zone"></span></button>
        <button class="tb-toggle no-arrow" id="tbEye" title="Eye" aria-label="Eye" aria-pressed="false"><svg><use href="#ic-eye"/></svg></button>
      </div>
      <div id="saveState" role="status" aria-live="polite"></div>
    </header>

    <main id="main">
      <aside id="sidebar">
        <div id="pagesBar"></div>
        <button id="btnAddPage" title="Add page">+</button>
      </aside>

      <section id="viewport">
        <div id="canvasHost">
          <div id="canvasStack">
            <div id="stackInner">
              <canvas id="paperC"></canvas>
              <canvas id="rasterC"></canvas>
              <canvas id="inkC"></canvas>
              <canvas id="liveC"></canvas>
              <canvas id="laserC"></canvas>
              <canvas id="rulerC"></canvas>
              <div id="titleStrip"><span>TITLE</span></div>
            </div>
          </div>
        </div>

        <div id="penFlyout" class="flyout hidden" role="dialog" aria-label="Pen">
          <div class="flyout-title">PEN</div>
          <div id="penTypeRow" role="group" aria-label="Pen type"></div>
          <div class="flyout-label">COLOR</div>
          <div id="penPalette"></div>
          <div class="flyout-label">SIZE</div>
          <canvas id="wavePreview" width="320" height="56" aria-hidden="true"></canvas>
          <input id="width" type="range" min="0.5" max="12" step="0.1" value="1.06" aria-label="Pen width">
          <input id="colorPicker" type="color" value="#000000" title="Custom color" hidden>
        </div>

        <div id="saveFlyout" class="flyout hidden" role="dialog" aria-label="Save">
          <label class="fs-label" for="saveTitle">Title</label>
          <div class="fs-input">
            <input id="saveTitle" type="text" autocomplete="off" spellcheck="false">
            <button id="saveTitleClear" class="fs-clear" title="Clear" aria-label="Clear title">&#10005;</button>
          </div>
          <label class="fs-label" for="saveProject">Project</label>
          <div class="fs-input"><input id="saveProject" type="text" placeholder="new folder name" autocomplete="off" spellcheck="false"></div>
          <div class="fs-actions">
            <button id="btnExport" class="fs-btn accent">Options</button>
            <button id="btnSaveConfirm" class="fs-btn">Save</button>
          </div>
        </div>

        <div id="paperColorFlyout" class="flyout hidden" role="dialog" aria-label="Background Color">
          <div class="flyout-label">BACKGROUND COLOR</div>
          <div id="paperPalette"></div>
          <input id="paperBgPicker" type="color" value="#ffffff" title="Custom color" hidden>
        </div>

        <div id="libraryFlyout" class="hidden">
          <div id="libHead">Library</div>
          <div id="tree"></div>
        </div>
        <div id="shapeFlyout" class="flyout hidden" role="dialog" aria-label="Shapes and text">
          <div class="flyout-title">SHAPES &amp; TEXT</div>
          <div id="shapeGrid" role="listbox" aria-label="Shapes"></div>
          <div class="flyout-label">TEXT BOX</div>
          <button id="btnTextTool" class="sh-textbtn"><svg><use href="#ic-text"/></svg>Text</button>
        </div>

        <div id="eraserFlyout" class="flyout hidden" role="dialog" aria-label="Eraser">
          <div class="flyout-title">ERASER</div>
          <div id="erModes" role="radiogroup" aria-label="Eraser mode">
            <button id="erStroke" class="er-opt active" aria-pressed="true"><svg><use href="#ic-eraser"/></svg>Stroke</button>
            <button id="erSegment" class="er-opt" aria-pressed="false"><svg><use href="#ic-eraserpoint"/></svg>Segment</button>
            <button id="erSheet" class="er-opt" aria-pressed="false"><svg><use href="#ic-erasersheet"/></svg>Sheet</button>
          </div>
          <div id="erSizeRow">
            <div class="flyout-label">SEGMENT SIZE</div>
            <div id="erSizes" role="radiogroup" aria-label="Segment size">
              <button class="er-chip" data-mm="2">S</button>
              <button class="er-chip active" data-mm="5">M</button>
              <button class="er-chip" data-mm="10">L</button>
            </div>
            <canvas id="erWave" width="280" height="44" aria-hidden="true"></canvas>
          </div>
        </div>

        <div id="shapeTextHint" class="hidden" role="status"></div>
        <div id="pullHint" class="pullHint hidden" role="status">
          <div class="pullFill" aria-hidden="true"></div>
          <span class="pullText">Kéo xuống để tạo trang mới</span>
        </div>
      </section>
    </main>

    <section id="paperPanel" class="hidden" role="dialog" aria-label="Paper">
      <div class="pp-label">PAPER</div>
      <div id="ppThumbs" role="listbox" aria-label="Paper template"></div>
      <div class="pp-row">
        <button id="ppPortrait" class="pp-btn accent" aria-pressed="true"><svg><use href="#ic-portrait"/></svg>Portrait</button>
        <button id="ppLandscape" class="pp-btn" aria-pressed="false"><svg><use href="#ic-landscape"/></svg>Landscape</button>
        <span class="pp-rule" aria-hidden="true"></span>
        <button id="ppBgColor" class="pp-btn plain"><svg><use href="#ic-palette"/></svg>Background Color</button>
        <span class="pp-rule" aria-hidden="true"></span>
        <label class="pp-switch">
          <input id="paperBrl" type="checkbox" checked>
          <span class="pp-pill" aria-hidden="true"><span class="pp-knob"></span></span>
          Show Border Lines
        </label>
        <span class="pp-flex"></span>
        <button id="ppPaneOn" class="pp-btn accent" aria-pressed="true"><svg><use href="#ic-pane"/></svg>Writing Pane On</button>
        <button id="ppPaneOff" class="pp-btn" aria-pressed="false"><svg><use href="#ic-paneoff"/></svg>Writing Pane Off</button>
      </div>
    </section>
  </div>

  <div id="ctxMenu" class="ctxmenu hidden"></div>
  <div id="dlg" class="hidden"><div id="dlgBox"><div id="dlgText"></div><input id="dlgInput" /><div><button id="dlgOk">OK</button><button id="dlgCancel">Cancel</button></div></div></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
